# -------------------------------------------------------------
# Configurações Gerais
# -------------------------------------------------------------
set-option -g default-shell /bin/zsh
set -g prefix C-Space
bind C-l send-keys 'C-l'
bind r source-file ~/.tmux.conf
# bind c new-window -c "#{pane_current_path}"

set -g base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g set-clipboard on
set -g default-terminal "tmux-256color"
# (antigo) só valia para TERM=xterm-256color; o kitty é xterm-kitty e já traz RGB
# set -ag terminal-overrides ",xterm-256color:RGB"
# undercurl e sublinhado colorido (diagnósticos do LSP no nvim)
set -as terminal-features 'xterm-kitty:usstyle'

# set mode-keys vi
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
# bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'

set-option -g mouse on
set-option -g status-position top

# Lista de sessões com as usadas por último no topo (tmux 3.8: "time" virou "activity")
bind-key s choose-tree -Zs -O activity

# <prefix> Ctrl+c - Claude flutuante na pasta do pane atual (/exit fecha)
bind-key C-c display-popup -E -w 85% -h 85% -d "#{pane_current_path}" -e CLAUDE_POPUP=1 claude

bind-key a set-window-option synchronize-panes\; display-message "synchronize-panes is now #{?pane_synchronized,on,off}"

# -------------------------------------------------------------
# TMUX PLUGIN MANAGER (TPM) E PLUGINS
# -------------------------------------------------------------
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @continuum-restore 'on'

# -------------------------------------------------------------
# BARRA (híbrido: sem fundo, detalhes em turquesa colour45)
# -------------------------------------------------------------
set -g status-style "bg=default,fg=white"

# === STATUS LEFT: indicador do prefixo ===
set -g status-left-length 10
set -g status-left '#{?client_prefix,#[fg=colour45 bold] ❯ ,#[fg=colour238] ❮ }#[default] '

# === STATUS RIGHT: sessão e hora (turquesa com prefixo ativo) ===
set -g status-right-length 50
set -g status-right '#{?client_prefix,#[fg=colour45],#[fg=white dim]} #S | %H:%M #[default]'

# === FORMATO DAS JANELAS ===
# Inativas: apagadas, com - na última janela usada e ✚ quando houve atividade
# Ativa: turquesa em negrito, com Z quando o pane está em zoom
setw -g window-status-separator ""
setw -g window-status-current-style default   # tmux 3.8 sublinha a ativa por padrão
setw -g window-status-format         '#[fg=white dim] #I:#W#{?window_last_flag, -,}#{?window_bell_flag, 🔔,#{?window_activity_flag, ✚,}} #[default]'
setw -g window-status-current-format '#[fg=colour45 bold] #I:#W#{?window_zoomed_flag, Z,} #[default]'

# === NOTIFICAÇÕES DE ATIVIDADE ===
set -g monitor-activity on
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g window-status-activity-style ""   # evita o "reverse" padrão do tmux
# 🔔 = bell (o Claude toca via ~/dotfiles/claude/notify.sh); tem prioridade sobre o ✚
set -g monitor-bell on
set -g bell-action other
setw -g window-status-bell-style ""

# === BORDAS DOS PANES ===
setw -g pane-border-style        "fg=colour238"
setw -g pane-active-border-style "fg=colour45"
setw -g pane-border-lines heavy
setw -g pane-border-indicators both

# === POPUPS ===
setw -g popup-border-lines rounded
setw -g popup-border-style "fg=colour45"

# === MENSAGENS / LINHA DE COMANDO ===
set -g message-style         "fg=colour45,bg=colour234"
set -g message-command-style "fg=colour45,bg=colour234"

# === TÍTULO DO TERMINAL (Hyprland/waybar) ===
set -g set-titles on
set -g set-titles-string '#{pane_current_command} · #S:#W #{?session_alerts,✚,} #{?client_prefix,✼,}'

# Estilização do modo de copiar
set -g mode-style "fg=#1e1e2e,bg=#cba6f7,bold"

# === OUTRAS CONFIGURAÇÕES ESSENCIAIS ===
# Garante que você pode renomear a janela manualmente
set-window-option -g automatic-rename off
# -------------------------------------------------------------
# FIM BARRA
# -------------------------------------------------------------

# RESTAURANDO SESSÕES NO TMUX
set -g @resurrect-capture-pane-contents 'on'
# set -g @resurrect-strategy-nvim 'session' # Se você usa Neovim, salva a sessão dele também

