# -------------------------------------------------------------
# Configurações Gerais
# -------------------------------------------------------------
set-option -g default-shell /bin/zsh
set -g prefix C-Space
bind C-l send-keys 'C-l'
bind r source-file ~/.tmux.conf
# bind c new-window -c "#{pane_current_path}"

set -g base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g set-clipboard on
set -g default-terminal "tmux-256color"
# opção abaixo é essencial para aplicar o tema do catpuccin
set -ag terminal-overrides ",xterm-256color:RGB"

# set mode-keys vi
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
# bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'

set-option -g mouse on
set-option -g status-position top

bind-key a set-window-option synchronize-panes\; display-message "synchronize-panes is now #{?pane_synchronized,on,off}"

set -g window-status-format "#I: #W "
set -g window-status-current-format "#I: #W "

# -------------------------------------------------------------
# TMUX PLUGIN MANAGER (TPM) E PLUGINS
# -------------------------------------------------------------
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @continuum-restore 'on'

# -------------------------------------------------------------
# BARRA (Comentada)
# -------------------------------------------------------------
# Barra principal: Fundo Turquesa Claro (colour45), Texto Preto
set -g status-style "fg=black,bg=colour45"

# === FORMATO DAS JANELAS ===
# Janelas Inativas: Fundo Turquesa Claro, Texto Preto
set -g window-status-format "#[fg=black,bg=colour45] #I:#W "

# Janela Ativa: Fundo Preto, Texto Branco (para destacar)
set -g window-status-current-format "#[fg=white,bg=black] #I:#W "

# Estilização do modo de copiar
set -g mode-style "fg=#1e1e2e,bg=#cba6f7,bold" 

# === STATUS LEFT (Lado Esquerdo) ===
# Mostra o nome da Sessão (#S)
# O bloco de cor foi fechado e reaberto para garantir que o Turquesa seja aplicado em toda a barra
set -g status-left-length 50

# === STATUS RIGHT (Lado Direito) ===
# Mostra Data e Hora
# Fundo Preto, Texto Branco (usando a mesma cor da janela ativa para um toque de design)
# set -g status-right '#[fg=white,bg=black]#S #D '
# set -g status-right '#[fg=white,bg=black] #S | %H:%M | %d-%b-%y '
set -g status-right '#[fg=white,bg=black] #S | %H:%M '
set -g status-right-length 100
# prefixo ativado
set -g status-left '#{?client_prefix,#[fg=colour45 bg=colour232] ❯ #[default],#[fg=colour238 bg=color234] ❮ #[default]} '

# === OUTRAS CONFIGURAÇÕES ESSENCIAIS ===
# Garante que você pode renomear a janela manualmente
set-window-option -g automatic-rename off
# -------------------------------------------------------------
# FIM BARRA
# -------------------------------------------------------------

# RESTAURANDO SESSÕES NO TMUX
set -g @resurrect-capture-pane-contents 'on'
# set -g @resurrect-strategy-nvim 'session' # Se você usa Neovim, salva a sessão dele também

