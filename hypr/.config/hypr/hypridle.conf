# ~/.config/hypr/hypridle.conf

general {
    lock_cmd = pidof hyprlock || hyprlock       # evita iniciar múltiplas instâncias do hyprlock
    before_sleep_cmd = loginctl lock-session    # bloqueia a tela antes do sistema suspender
    after_sleep_cmd = hyprctl dispatch dpms on  # garante que a tela acorde após suspender
}

# 1. Esmaecer a tela (Aviso prévio igual ao Windows)
listener {
    timeout = 300                                # 5 minutos
    on-timeout = brightnessctl -s set 10%        # salva o brilho atual e reduz para 10%
    on-resume = brightnessctl -r                 # restaura o brilho original ao mexer o mouse/teclado
}

# 2. Bloquear a tela
listener {
    timeout = 600                                # 10 minutos
    on-timeout = loginctl lock-session           # dispara o comando de bloqueio (hyprlock)
}

# 3. Desligar a tela (Economia de energia)
listener {
    timeout = 630                                # 10.5 minutos (30 seg após bloquear)
    on-timeout = hyprctl dispatch dpms off       # desliga o sinal de vídeo
    on-resume = hyprctl dispatch dpms on         # liga o sinal de vídeo
}

# 4. Suspender o sistema (Opcional - Remova ou comente se não quiser)
listener {
    timeout = 1000                                # 17 minutos
    on-timeout = systemctl suspend               # coloca o PC para dormir
}
